<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .strand-a { animation: strandA 2.4s ease-in-out infinite; transform-origin: 32px 8px; }
    .strand-b { animation: strandB 2.4s ease-in-out infinite; transform-origin: 32px 8px; }
    .strand-c { animation: strandC 2.4s ease-in-out infinite; transform-origin: 32px 8px; }
    .hand { animation: braidHand 2.4s ease-in-out infinite; }
    @keyframes strandA {
      0%, 100% { transform: translateX(0) skewX(0deg); }
      50% { transform: translateX(5px) skewX(4deg); }
    }
    @keyframes strandB {
      0%, 100% { transform: translateX(0) skewX(0deg); }
      50% { transform: translateX(-5px) skewX(-4deg); }
    }
    @keyframes strandC {
      0%, 100% { transform: translateX(0) scaleX(1); }
      50% { transform: translateX(2px) scaleX(0.85); }
    }
    @keyframes braidHand {
      0%, 100% { transform: translate(0, 0) rotate(-4deg); }
      50% { transform: translate(-2px, 5px) rotate(4deg); }
    }
  </style>

  <!-- Mechas de cabelo -->
  <path d="M26 6 C22 16 20 26 22 38 C24 50 30 56 34 60" stroke="#a855f7" stroke-width="3.5" fill="none" stroke-linecap="round" class="strand-a"/>
  <path d="M32 4 C32 14 34 24 34 38 C34 50 32 56 30 60" stroke="#7e22ce" stroke-width="3.5" fill="none" stroke-linecap="round" class="strand-b"/>
  <path d="M38 6 C42 16 44 26 42 38 C40 50 34 56 30 60" stroke="#c084fc" stroke-width="3.5" fill="none" stroke-linecap="round" class="strand-c"/>

  <!-- Trança entrelaçada (cruzes) -->
  <g stroke="#e9d5ff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M26 16 Q32 20 38 24"/>
    <path d="M38 24 Q32 28 26 32"/>
    <path d="M26 32 Q32 36 38 40"/>
    <path d="M38 40 Q32 44 26 48"/>
  </g>

  <!-- Mão trançando (palma + dedos) -->
  <g class="hand">
    <ellipse cx="46" cy="30" rx="7" ry="5.5" fill="#b45309" transform="rotate(20 46 30)"/>
    <rect x="38" y="25" width="12" height="4" rx="2" fill="#f3e8ff" transform="rotate(20 44 27)"/>
    <rect x="37" y="30" width="12" height="4" rx="2" fill="#ede9fe" transform="rotate(20 43 32)"/>
    <rect x="38" y="35" width="11" height="4" rx="2" fill="#f5f3ff" transform="rotate(20 43 37)"/>
  </g>
</svg>
